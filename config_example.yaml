# Example configuration for synop_maps.py
# Copy this file, edit it, then:  python3 synop_maps.py submit my_config.yaml

name: my_comparison            # used for job names and the default workdir
# workdir: /scratch/$USER/synop_maps/my_comparison   # default: ./runs/<name>
# store: $PERM/synop_store     # geopoint files shared by all configs; default: ./store
# collocate: vino              # vino: upload to / download from VINO
#                              # local: vino_genfc writes the station values to the
#                              #        store only (no VINO upload); can also be set
#                              #        per experiment (and per period)

# Forecast base dates/times (MARS style lists or ranges are fine)
dates: 20250601/to/20250630/by/1
# Or several named periods instead of `dates`; each gets its own statistics and
# is selectable on the same page (colour scales are shared between periods):
# An end date "-" (e.g. 20241201/to/-/by/1) means up to the last date available
# in MARS for all experiments; `submit` checks MARS again every time.
# periods:
#   DJF: 20231201/to/20240229/by/1
#   JJA: 20240601/to/20240831/by/1
times: [0, 12]
steps: 24/to/240/by/24

# Parameters (MARS names as understood by vino_genfc / vino_getgeo).
# Accumulated / extreme parameters need a period in hours; steps shorter than
# the period are skipped automatically.
parameters:
  - param: 2t
  - param: 10ff
  - param: msl
  - param: tp
    period: 24
  # Upper-air parameters at TEMP (radiosonde) stations: t, z, ff, dd, td on
  # pressure levels in hPa. They are always collocated locally from MARS
  # (needs upper_air.grid), for every experiment including operations.
  # - {param: t, levels: [850, 500, 250]}
  # - {param: z, levels: [500]}        # plotted as geopotential height (gpm)

# Experiments. The FIRST one is the reference for difference maps.
#   upload: true   -> missing dates are pushed to VINO with vino_genfc
#   upload: false  -> data is assumed to be in VINO already (e.g. operations)
#   collocate: local -> no VINO upload/download; collocated locally into the store
# With `periods`, any experiment setting (expver, stream, upload, ...) can be
# given per period while the label stays the same, e.g.
#   - label: myexp
#     expver: {DJF: abcd, JJA: efgh}
experiments:
  - label: oper
    class: od
    stream: oper
    expver: "0001"
    type: fc
    upload: false
  - label: exp1
    class: rd
    stream: oper           # lwda for experiments run with the long window DA
    expver: abcd
    type: fc
    # anoffset: 9          # needed for stream lwda
    upload: true
  # Ensembles: type pf with the member numbers; adds fair CRPS maps and scores
  # - label: ens
  #   class: rd
  #   stream: enfo
  #   expver: ijkl
  #   type: pf
  #   numbers: 1/to/8
  #   control: true        # add the control forecast (cf) as a member
  # - label: exp2
  #   class: rd
  #   stream: lwda
  #   expver: efgh
  #   anoffset: 9
  #   type: fc

sources: [synop]               # VINO observation sources
interpolation: nearest_point   # nearest_point | nearest_land_point | nearest_sea_point
chunk_size: 15                 # dates per vino_genfc / vino_getgeo call
parallel: 4                    # concurrent vino_genfc / vino_getgeo calls

genfc:
  ignore_missing: true         # skip dates missing in MARS instead of failing
  get_orog_once: true
  extra_args: []               # any other vino_genfc arguments, e.g. ["--grid", "0.1/0.1"]

upper_air:                     # only used for parameters with `levels`
  sources: [temp]              # VINO data set of the observations
  grid: O400                  # MARS grid the forecast fields are interpolated to;
                               # an experiment's own `grid` takes precedence
  interpolation: nearest_point # nearest_point | bilinear

plot:
  regions:                     # name: [west, east, south, north] or null for global
    global: null
    europe: [-25, 45, 33, 72]
  min_fraction: 0.5            # station needs valid pairs for >= this fraction of forecasts
  daily_maps: false            # also draw maps for every single forecast (many images!)
  processes: 4                 # used when not running under slurm
  dpi: 150
  lapse_rate: 0.0065           # K/m, corrects 2t forecasts to station height (0 = off)
  max_dz: 250                  # m, exclude stations with |model - station elevation| > this (null = off)

publish:                       # upload index.html + plots after the plot stage
  site: null   # null = do not publish
  # path: my_folder             # folder on the site, default: the run name
  token_file: ~/.spatial_maps_sites

slurm:
  qos: nf
  # account: myproject
  upload:   {time: "24:00:00", mem: 16G, cpus: 4}
  collocate: {time: "24:00:00", mem: 16G, cpus: 4}
  download: {time: "12:00:00", mem: 16G, cpus: 4}
  plot:     {time: "06:00:00", mem: 32G, cpus: 4}
